# Lint and coverage configuration ONLY. This repo is deliberately NOT a
# pip-installable package.
#
# ── WHY THERE IS NO [project] SECTION ─────────────────────────────────────
# aw-workspace core runs off PATH (the repo root is on PATH — see the
# Dockerfile) with its dependencies installed from `requirements.txt`. It has
# never been a distribution and must not quietly become one: adding
# `[project]` here would make `pip install .` / `pip install -e .` succeed,
# which invites a second, divergent copy of `src/` into site-packages on a
# host that already imports it from the checkout. Without `[project]`, that
# command fails loudly instead, which is the correct outcome.
#
# This file exists because `docs/standards/pipeline-testing.md` §1.3 and §8.5
# both name the same blocker for putting core on the Tier-B lint standard:
# "aw-workspace (core) — needs a `pyproject.toml` first — it has none". This
# is that file, carrying nothing but the two linters' config.
#
# ── WHY pylint's MESSAGE SELECTION IS *NOT* HERE ──────────────────────────
# `--disable=all --enable=E --disable=E0401,E1101` is passed explicitly on
# the command line in BOTH places pylint runs (the `lint` job in
# `.github/workflows/test.yml` and the `pylint-errors-only` hook in
# `.pre-commit-config.yaml`), and deliberately not centralised here. pylint
# only discovers `pyproject.toml` relative to its working directory; if that
# discovery ever failed, a config-driven `disable=all` would silently stop
# applying and pylint would run its FULL check set — turning a focused
# error-class gate into hundreds of style findings and a red build nobody
# asked for. Command-line flags cannot fail that way.

[tool.ruff]
# The deployed container and the CI test container are both
# `python:3.12-slim` (see `.github/workflows/test.yml`). Linting against a
# different interpreter than the one that runs is worth less than it looks.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# ruff's own default set (E4 imports, E7 statements, E9 syntax/IO, F
# pyflakes) plus `I` (import sorting). `I` is included so the rule is
# RECORDED rather than silently absent — it is the single largest category in
# this tree's measured baseline, and the CI step that runs these rules is
# report-only precisely because of it. See the `lint` job's own comment in
# `.github/workflows/test.yml` for the measured numbers and for why a blind
# `ruff check --fix` of that baseline is not safe in this repo.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pylint.main]
# Matches `target-version` above and the runtime interpreter.
py-version = "3.12"
jobs = 0  # one process per core; the E-class sweep over src/ is CPU-bound.

[tool.coverage.report]
# Baseline measured 2026-11-06 on the existing ephemeral-PG+Redis `unit` job
# (`.github/workflows/test.yml`), rounded down, same discipline as every
# other repo on docs/standards/pipeline-testing.md. The term-missing table's
# TOTAL column rounds to 89%, but the precise figure — what `fail_under`
# actually compares against — is 88.69% (31345 statements, ~3545-3557
# missed across 3 CI runs of the identical commit; the small variance is
# itself evidence of the flake below, not noise worth chasing). A first
# commit here set `fail_under = 89` off the rounded display and that CI run
# caught its own mistake: "Required test coverage of 89.0% not reached.
# Total coverage: 88.69%". 88 is the correct floor. coverage.py
# auto-discovers this section from pyproject.toml with no `--cov-config`
# needed, same as `aw-app-template`/`aw-app-uc-phd`.
#
# Known flake, now FIXED (card 4115bf3b-9510-8123), not a regression in the
# baseline above. Card 4105bf3b-9510-8176 (this card's own first commit)
# originally named 2 flaky tests from 3 PR-time CI runs; QA then re-ran the
# merge commit's `unit` job and found a 2-of-3 failure rate spanning 4
# distinct tests across 2 files, plus a 5th same-shape test not yet observed
# failing — two genuinely distinct mechanisms, both fixed below rather than
# retried or skipped.
#
# Mechanism A — originally suspected to be "a fixed 5s real sleep is the
# test's entire safety margin, eaten by coverage-tracing overhead". That
# theory was wrong, or at least incomplete: lengthening the sleep alone (5s
# -> 300s) did NOT make the race deterministic — it still failed on the
# first 8+ of several hundred CI-representative reruns with the longer
# sleep. Direct repro traced the real mechanism to fork-vs-setsid, not
# timer expiry: `setsid sleep N &`'s backgrounded child is briefly still a
# MEMBER of the service's own process group until it completes its own
# `setsid()` syscall, and `stop()`'s `killpg` can reach — and kill — that
# child if it fires inside that window, regardless of the sleep argument.
# "ready" in the service's log only proves the fork happened, not that
# `setsid()` has completed, so waiting on "ready" alone (the original test
# design) leaves this window open on every run; coverage/CI-load scheduling
# delay widens how often a run actually lands inside it, which is why it
# correlated with coverage without being caused by coverage tracing speed.
# Affects src/tests/integration/apps/test_service_restart_loop.py::
# test_a_deliberate_stop_is_not_respawned and
# ::test_a_straggler_pump_does_not_spawn_a_third_copy, plus
# src/tests/integration/apps/test_services.py::
# test_restart_on_the_owner_keeps_the_lease_for_the_new_process — all three
# assert the service's log pump is still alive immediately after
# stop()/restart(), relying on the detached child to still hold the stdout
# pipe open. Fixed by waiting for the detached child to actually become its
# own session leader (`os.getsid(pid) == pid`) before calling stop()/
# restart(), which closes the race outright (20+ of 20 CI-representative
# reruns clean), plus lengthening the sleep to 300s and explicitly killing
# the child right after the assertion as defense in depth against any
# narrower residual window.
#
# Mechanism B — an unawaited background task raced the test's first HTTP
# request. src/tests/integration/api/test_skills_routes.py::
# test_list_skills_includes_native_and_app_owned_with_correct_editable_flag
# and ::test_open_returns_a_code_server_url both read the merged `skills/`
# tree, which `src/api/app.py`'s lifespan populates via an
# `asyncio.ensure_future`'d background task (`_boot_reconcile_and_sync` ->
# `sync_on_boot` -> `skills_sync.materialize()`) that the fixture never
# awaited — only `reconcile_on_boot` was stubbed, not this second,
# independent setup step. At normal speed the thread-pool copy won by a wide
# margin against TestClient's own request-dispatch overhead; coverage's
# uneven tracing overhead could invert that margin. Fixed by stubbing
# `sync_on_boot` the same way `reconcile_on_boot` already was, and calling
# `skills_sync.materialize()` synchronously in the fixture instead of
# racing it.
fail_under = 88
