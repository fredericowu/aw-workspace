name: Code Review

# Thin caller. The whole two-round PR review -> merge loop lives in
# fredericowu/aw-shared-workflows — read that file's header for the state
# machine, the fail-closed `blocks_merge` rule, the RUNNER_TEMP discipline and
# the reason the merge uses a PAT and never GITHUB_TOKEN.
#
# This repo is the THIRD consumer of that loop (tekflox/aw-app-template, then
# fredericowu/agents-platform-multitenant, now core) and the reason it became
# a reusable workflow instead of a third ~975-line copy-paste.
#
# ── WHY AN EXACT TAG, NOT @master ─────────────────────────────────────────
# `@v1.1.0` is immutable and is never retagged. A moving ref here would mean
# an edit in the shared repo changes this repo's merge gate with no commit on
# this repo — the same shape as app-release.yml, which ~45 app repos reference
# via a moving `@master` and where one fail-loud edit reddened the whole
# marketplace at once. Bumps are deliberate, one caller at a time, with
# aw-app-template as the canary.
#
# v1.1.0, and the two bumps that got here are the canary rule paying for
# itself twice on its first day. Converting aw-app-template FIRST (deliberate
# — it is the oldest and most-exercised consumer) surfaced both, in a repo
# whose own loop was already working, before either reached this one:
#
#   v1.0.1  `CodeRabbit` was missing from the merge gate's advisory set. The
#           extraction source was AP-MT, which has no CodeRabbit installed, so
#           the template is the only repo in this rollout that would ever have
#           hit it — and there it would have hung the gate on a pending
#           third-party check until the 20-minute deadline.
#   v1.1.0  `secrets: inherit` does NOT cross an account boundary. GitHub only
#           carries `inherit` within one org/enterprise, so the template
#           (`tekflox/…` calling `fredericowu/…`) received an EMPTY
#           AW_CODEREVIEW_V1_KEY despite having the secret set. The three
#           secrets are now declared upstream and passed by name — see the
#           `secrets:` block below.
#
# Neither fix was a retag: v1.0.0 and v1.0.1 remain published and unmodified,
# which is the whole point of pinning exact tags. Strictly speaking neither
# defect could affect THIS repo (no CodeRabbit here, and same-owner `inherit`
# works), so this bump buys one pin and one secrets convention across all
# three callers instead of silent drift between them.
#
# ── THIS REPO'S DELIBERATE DIFFERENCES ────────────────────────────────────
#   1. `ci_check_name: unit` — test.yml's single job id. VERIFIED against a
#      real `gh pr checks` run on this repo's own PR, not read off the YAML:
#      test.yml triggers on BOTH `push` and `pull_request`, so the check can
#      appear from two event types, and the shared workflow's gate requires it
#      PRESENT and passing (absent never reads as fine).
#   2. Default `runs_on` — GitHub-hosted `ubuntu-latest`. Core stays entirely
#      off the single self-hosted `aw-baremetal` runner: that box already
#      carries AP-MT's test + deploy (a ~27-min queue today) and core's own
#      CI moved to GitHub-hosted runners in 2026-09. Zero new load there.
#   3. NO branch protection on this repo, even though it is public and
#      therefore could have it. Direct push to master stays available as the
#      break-glass path, and not only for emergencies: the agent fleet,
#      `sync_on_boot`, and `aw-workspace-cli repo-sync` all push master
#      directly today. The shared workflow's `ci_gate` is consequently the
#      ONLY thing between a red suite and a squash-merge, which is why it
#      must stay pinned to a real check name.
#
# ── ONE TRAP, IF YOU ARE EDITING *THIS FILE* IN A PR ──────────────────────
# `pull_request` runs this file's PR copy (round 1 sees your edits live);
# `issue_comment` (`/aw-review`, round 2) always runs the DEFAULT BRANCH's
# copy. So a PR that changes this file — including one that only bumps the
# `@vX.Y.Z` pin — cannot exercise its own round 2. Verify round 2 on the NEXT
# PR after merge; don't burn time "debugging" that.

on:
  pull_request:
    # `closed` is here only for the shared workflow's merged-event job; its
    # gate job excludes `closed` explicitly, so a close never dispatches a
    # review.
    types: [opened, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

# Stays in the caller, not in the reusable workflow: what needs serializing is
# "reviews of THIS repo's PR #N". A reusable workflow's own `concurrency`
# would key on the shared file's identity instead, collapsing unrelated repos
# into one queue.
concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    uses: fredericowu/aw-shared-workflows/.github/workflows/code-review-reusable.yml@v1.1.2
    with:
      ci_check_name: unit
    # Declared here as well as in the called workflow: for a reusable
    # workflow the effective GITHUB_TOKEN permissions are the INTERSECTION of
    # the two, so the caller's copy is what lifts this repo above its default
    # workflow permissions. That intersection cuts BOTH ways: a scope omitted
    # here cannot be granted by the shared file, and a scope the shared file
    # omits cannot be granted here. An unlisted scope is an explicit `none`,
    # never an inherit. v1.1.1 added `checks: read` to the callers only and
    # was therefore inert; v1.1.2 requests it on both sides and tests that
    # the two lists match.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      # Not currently load-bearing on THIS repo, and listed anyway. The merge
      # gate reads the PR's checks with `gh pr checks`, which goes through the
      # Checks API; that read is refused without this scope on a PRIVATE repo
      # and permitted without it on a public one. aw-workspace is public
      # today, so omitting it would work — right up until the repo is ever
      # made private, at which point the gate starts reporting `required
      # check(s) ['unit'] did not report a pass ... Saw: []` on every round,
      # which reads like a CI failure rather than a permissions problem.
      # That exact confusion cost AP-MT (private) four consecutive rounds
      # while the public aw-app-template merged first try on identical code.
      checks: read
    # Passed BY NAME, not `secrets: inherit` — v1.1.0's contract, and the
    # same form the other two callers use. `inherit` would in fact still work
    # here (this repo and aw-shared-workflows are both owned by
    # `fredericowu`, and `inherit` only carries within one org/enterprise),
    # but relying on that would make this caller the odd one out AND make it
    # silently correct for a reason that has nothing to do with this repo. It
    # broke for real on the cross-owner caller: tekflox/aw-app-template
    # passed `inherit`, had AW_CODEREVIEW_V1_KEY set, and still received an
    # EMPTY STRING. Being explicit costs three lines and removes a trap.
    #
    # Each is declared `required: false` upstream so a missing one produces
    # the shared workflow's own fail-loud error, naming this repo and the
    # secret, instead of GitHub refusing the whole call with a generic
    # validation error before any of those diagnostics can run.
    secrets:
      AW_CODEREVIEW_V1_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY }}
      AW_DEVTEAM_MERGE_TOKEN: ${{ secrets.AW_DEVTEAM_MERGE_TOKEN }}
      AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
