name: Code Review

# Thin caller. The whole two-round PR review -> merge loop lives in
# fredericowu/aw-shared-workflows — read that file's header for the state
# machine, the fail-closed `blocks_merge` rule, the RUNNER_TEMP discipline and
# the reason the merge uses a PAT and never GITHUB_TOKEN.
#
# This repo is the THIRD consumer of that loop (tekflox/aw-app-template, then
# fredericowu/agents-platform-multitenant, now core) and the reason it became
# a reusable workflow instead of a third ~975-line copy-paste.
#
# ── WHY AN EXACT TAG, NOT @master ─────────────────────────────────────────
# `@v1.1.4` is immutable and is never retagged. A moving ref here would mean
# an edit in the shared repo changes this repo's merge gate with no commit on
# this repo — the same shape as app-release.yml, which ~45 app repos reference
# via a moving `@master` and where one fail-loud edit reddened the whole
# marketplace at once. Bumps are deliberate, one caller at a time, with
# aw-app-template as the canary.
#
# v1.1.0, and the two bumps that got here are the canary rule paying for
# itself twice on its first day. Converting aw-app-template FIRST (deliberate
# — it is the oldest and most-exercised consumer) surfaced both, in a repo
# whose own loop was already working, before either reached this one:
#
#   v1.0.1  `CodeRabbit` was missing from the merge gate's advisory set. The
#           extraction source was AP-MT, which has no CodeRabbit installed, so
#           the template is the only repo in this rollout that would ever have
#           hit it — and there it would have hung the gate on a pending
#           third-party check until the 20-minute deadline. (v1.3.0 deleted
#           that deadline along with the poll; an advisory check that sits
#           pending now simply never blocks anything.)
#   v1.1.0  `secrets: inherit` does NOT cross an account boundary. GitHub only
#           carries `inherit` within one org/enterprise, so the template
#           (`tekflox/…` calling `fredericowu/…`) received an EMPTY
#           AW_CODEREVIEW_V1_KEY despite having the secret set. The three
#           secrets are now declared upstream and passed by name — see the
#           `secrets:` block below.
#
# Neither fix was a retag: v1.0.0 and v1.0.1 remain published and unmodified,
# which is the whole point of pinning exact tags. Strictly speaking neither
# defect could affect THIS repo (no CodeRabbit here, and same-owner `inherit`
# works), so this bump buys one pin and one secrets convention across all
# three callers instead of silent drift between them.
#
# ── THIS REPO'S DELIBERATE DIFFERENCES ────────────────────────────────────
#   1. `ci_check_name: unit` — test.yml's single job id. VERIFIED against a
#      real `gh pr checks` run on this repo's own PR, not read off the YAML:
#      test.yml triggers on BOTH `push` and `pull_request`, so the check can
#      appear from two event types, and the shared workflow's gate requires it
#      PRESENT and passing (absent never reads as fine).
#   2. Default `runs_on` — GitHub-hosted `ubuntu-latest`. Core stays entirely
#      off the single self-hosted `aw-baremetal` runner: that box already
#      carries AP-MT's test + deploy (a ~27-min queue today) and core's own
#      CI moved to GitHub-hosted runners in 2026-09. Zero new load there.
#   3. BRANCH PROTECTION, as of card 4105bf3b-9510-81de — an active, zero-
#      bypass-actor ruleset on refs/heads/master (require PR, block force-
#      push, block deletion). This superseded the earlier "no branch
#      protection, direct push is the break-glass path" state: that claim
#      had already gone stale by the time it was checked — neither
#      `sync_on_boot` nor `aw-workspace-cli repo-sync` ever pushes (both are
#      fetch/pull-only; see `src/cli/commands/repo_sync.py`), so the only
#      actual direct pushers were Dev Team agent sessions and the human,
#      exactly the actors the ruleset now routes through a PR. Break-glass
#      is a deliberate, auditable `gh api` ruleset disable, not a standing
#      bypass. The shared workflow's own check read — in its
#      `merge-attempt` job as of v1.3.0 — stays the thing this repo relies
#      on between a red suite and a squash-merge; the ruleset adds "a human
#      or an agent cannot skip review entirely," it doesn't replace CI.
#
# ── ONE TRAP, IF YOU ARE EDITING *THIS FILE* IN A PR ──────────────────────
# `pull_request` runs this file's PR copy, so rounds 1 and 2 both see your
# edits live. `issue_comment` (`/aw-review`) and `workflow_run` BOTH always
# run the DEFAULT BRANCH's copy. So a PR that changes this file — including
# one that only bumps the `@vX.Y.Z` pin or edits the trigger list — cannot
# exercise its own comment path or its own workflow_run path. Verify those on
# the NEXT PR after merge; don't burn time "debugging" them. That is exactly
# why v1.3.0's canary on tekflox/aw-app-template took two PRs rather than one.

# ── THE TRIGGER SURFACE, AND WHY IT GREW IN v1.3.0 ────────────────────────
# `synchronize` was deliberately absent here for four releases, for a real
# reason that has NOT gone away: a full deep review (one judge run plus up to
# 3 research runs) costs real subscription budget, and PR-Agent already
# reviews every push. "Review every push" was never the ask.
#
# What v1.3.0 adds is narrower than that. The shared gate admits a
# `synchronize` ONLY when the PR already carries `devteam:awaiting-fixes` —
# i.e. the coder's fix push, which is precisely the event round 2 was sitting
# and waiting for. Anything else is refused after a single label read, before
# any paid run. So the budget rationale is preserved in the gate rather than
# in this trigger list, and the manual step it replaces (`/aw-review` after
# every fix push) is gone. `/aw-review` itself is untouched and remains the
# override from any round.
#
# `workflow_run` is the other half, and it is what lets the merge stop
# polling. The shared workflow's `merge-attempt` job re-attempts the merge
# when THIS repo's own CI finishes, however long that takes — replacing a
# 20-minute `gh pr checks` loop that gave up at its deadline. `workflows:`
# takes the CI workflow's `name:`, NOT its filename and NOT its job id.
# Rename that workflow and nothing fails loudly; the event simply stops
# arriving and merges whose CI finishes after the review verdict quietly stop
# happening. Confirm the string with
#   gh api repos/<owner>/<repo>/actions/workflows --jq '.workflows[].name'
#
# The `|| github.event.workflow_run.head_branch` arm of the concurrency group
# below is required alongside it: a workflow_run event has neither
# `pull_request.number` nor `issue.number`, so without it every workflow_run
# run in this repo collapses into the single group `code-review-` and, with
# `cancel-in-progress: false`, queues one at a time.
#
# Proven on the canary before landing here: tekflox/aw-app-template PR #21
# (same-run path, merged with no poll) and PR #22 (CI deliberately slowed, so
# the same-run attempt declined with "still running" and the merge arrived via
# the workflow_run hop).
#
# ── v1.4.0: provenance-gate ────────────────────────────────────────────────
# New job between `gate` and `merge-attempt`: fails unless a PR commit
# carries a well-formed `AW-Run-Id` trailer (stamped by a `prepare-commit-msg`
# hook in the Dev Team's runner containers — card 40f5bf3b-9510-811d, still in
# progress) or a human applies the `provenance-exempt` label (created on this
# repo ahead of this bump). No caller-side change needed: no new permission
# scope (its `gh api` calls are all covered by scopes already granted above)
# and no new trigger. Proven end-to-end on the canary: tekflox/aw-app-template
# PR #24.
#
on:
  pull_request:
    # `synchronize` -> automatic round 2 on the coder's fix push; the shared
    # gate refuses it on any other round. See the trigger note above.
    #
    # `closed` is here only for the shared workflow's merged-event job; its
    # gate job excludes `closed` explicitly, so a close never dispatches a
    # review.
    types: [opened, reopened, ready_for_review, synchronize, closed]
  issue_comment:
    types: [created]
  # This repo's own CI, BY ITS `name:` (not its filename, not its job id).
  workflow_run:
    workflows: ["Test"]
    types: [completed]

# Stays in the caller, not in the reusable workflow: what needs serializing is
# "reviews of THIS repo's PR #N". A reusable workflow's own `concurrency`
# would key on the shared file's identity instead, collapsing unrelated repos
# into one queue.
concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  review:
    uses: fredericowu/aw-shared-workflows/.github/workflows/code-review-reusable.yml@v1.5.0
    with:
      ci_check_name: unit
    # Declared here as well as in the called workflow: for a reusable
    # workflow the effective GITHUB_TOKEN permissions are the INTERSECTION of
    # the two, so the caller's copy is what lifts this repo above its default
    # workflow permissions. That intersection cuts BOTH ways: a scope omitted
    # here cannot be granted by the shared file, and a scope the shared file
    # omits cannot be granted here. An unlisted scope is an explicit `none`,
    # never an inherit. v1.1.1 added `checks: read` to the callers only and
    # was therefore inert; v1.1.2 requests it on both sides and tests that
    # the two lists match.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      # Not currently load-bearing on THIS repo, and listed anyway. The merge
      # gate reads the PR's checks with `gh pr checks`, which goes through the
      # Checks API; that read is refused without this scope on a PRIVATE repo
      # and permitted without it on a public one. aw-workspace is public
      # today, so omitting it would work — right up until the repo is ever
      # made private, at which point the gate starts reporting `required
      # check(s) ['unit'] did not report a pass ... Saw: []` on every round,
      # which reads like a CI failure rather than a permissions problem.
      # That exact confusion cost AP-MT (private) four consecutive rounds
      # while the public aw-app-template merged first try on identical code.
      checks: read
      # SAME not-currently-load-bearing-here story, for a separate,
      # later-discovered scope gap: `gh pr checks` always embeds
      # checkSuite{workflowRun{...}} in its GraphQL query (gh v2.97.0), which
      # needs actions: read, not checks: read. Public repos' rollups are
      # readable without it; the private AP-MT hit a deterministic GraphQL
      # 403 on every poll for 20 minutes despite green CI. See
      # fredericowu/aw-shared-workflows#1.
      actions: read
    # Passed BY NAME, not `secrets: inherit` — v1.1.0's contract, and the
    # same form the other two callers use. `inherit` would in fact still work
    # here (this repo and aw-shared-workflows are both owned by
    # `fredericowu`, and `inherit` only carries within one org/enterprise),
    # but relying on that would make this caller the odd one out AND make it
    # silently correct for a reason that has nothing to do with this repo. It
    # broke for real on the cross-owner caller: tekflox/aw-app-template
    # passed `inherit`, had AW_CODEREVIEW_V1_KEY set, and still received an
    # EMPTY STRING. Being explicit costs three lines and removes a trap.
    #
    # Each is declared `required: false` upstream so a missing one produces
    # the shared workflow's own fail-loud error, naming this repo and the
    # secret, instead of GitHub refusing the whole call with a generic
    # validation error before any of those diagnostics can run.
    secrets:
      AW_CODEREVIEW_V1_KEY: ${{ secrets.AW_CODEREVIEW_V1_KEY }}
      AW_DEVTEAM_MERGE_TOKEN: ${{ secrets.AW_DEVTEAM_MERGE_TOKEN }}
      AW_DEVTEAM_EVENT_SECRET: ${{ secrets.AW_DEVTEAM_EVENT_SECRET }}
