name: Build + push image

# Runs on every push to master (Frederico decision 2026-09-17, superseding
# the 2026-08-01 manual-only call — see git history for that comment). Every
# push that lands now cuts a real release: auto-bumps the MINOR version
# (patch reset to 0, matching the aw-marketplace app-release.yml convention
# the apps already use — see aw-app-agents-platform-runners' release.yml)
# and publishes the image. `cancel-in-progress: true` below means a rapid
# string of pushes only ever builds the LATEST one, not a queue of redundant
# 30-min multi-arch builds. Safe to run this often now that the build runs
# on a GitHub-hosted runner (`ubuntu-latest`) instead of the single
# self-hosted `aw-workspace` machine — there is no longer a shared-capacity
# bottleneck to protect by gating this manually. `workflow_dispatch` stays
# for an explicit version override or a manual re-run.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to next vX.Y.0 minor bump)"
        type: string
        required: false

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build + push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 — full history, not a shallow clone, because this
      # checkout is COPYed into the image (including .git) so the running
      # container is a real, workable git repo (Frederico decision
      # 2026-08-01), not just a source snapshot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub-hosted ubuntu-latest is x86_64 only — QEMU is what lets
      # buildx cross-build the linux/arm64 leg below without a native arm64
      # runner. Replaces the old Podman-on-macbook-fred/Docker-on-bare-metal
      # branch (2026-08-01..2026-09-17): that existed because the
      # self-hosted `aw-workspace` runner label could resolve to either
      # machine, each with different native architectures; a single
      # GitHub-hosted runner type makes that whole detection moot.
      - name: Set up QEMU (arm64 emulation on this x86_64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            git fetch --tags --force
            latest="$(
              git tag -l 'v[0-9]*.[0-9]*.[0-9]*' |
                sort -V |
                tail -n 1
            )"
            if [ -z "${latest}" ]; then
              version="v0.1.0"
            else
              raw="${latest#v}"
              IFS=. read -r major minor patch <<< "${raw}"
              # Minor bump, patch reset to 0 — every push is its own release
              # now (see the top-of-file comment), so patch++ would just
              # count pushes forever. Matches the aw-marketplace
              # app-release.yml convention the apps already release under.
              minor=$((minor + 1))
              version="v${major}.${minor}.0"
            fi
          fi
          if ! echo "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must match vX.Y.Z, got ${version}"
            exit 1
          fi
          if git rev-parse "${version}" >/dev/null 2>&1; then
            echo "::error::resolved version ${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER_LC}/aw-workspace"

          echo "==> Building + pushing linux/amd64,linux/arm64 via buildx"
          docker buildx build \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --build-arg "AW_WORKSPACE_VERSION=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            --push \
            .

      - name: Tag release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "${VERSION}" "${{ github.sha }}"
          git push origin "${VERSION}"

      - name: Notify aw-backend release registry
        env:
          RELEASE_TOKEN: ${{ secrets.AW_RELEASE_WEBHOOK_TOKEN }}
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::warning::AW_RELEASE_WEBHOOK_TOKEN is not set; skipping release publish"
            exit 0
          fi

          SHORT_SHA="${SHA::7}"
          python3 - <<'PY' > /tmp/aw-workspace-release.json
          import json
          import os

          owner = os.environ["OWNER_LC"]
          sha = os.environ["SHA"]
          payload = {
              "component": "aw-workspace",
              "version": os.environ["VERSION"],
              "sha": sha,
              "image": f"ghcr.io/{owner}/aw-workspace",
              "tag": os.environ["VERSION"],
              "url": os.environ["RUN_URL"],
              "metadata": {
                  "workflow": "build-image",
                  "run_id": os.environ["RUN_ID"],
              },
          }
          print(json.dumps(payload))
          PY

          curl -fsS -X POST "https://api.aw.tekflox.com/api/releases/publish" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${RELEASE_TOKEN}" \
            --data-binary @/tmp/aw-workspace-release.json

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-workspace image pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:${{ steps.version.outputs.version }}\` |"
            echo "| **Version** | \`${{ steps.version.outputs.version }}\` |"
            echo "| **Platforms** | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
