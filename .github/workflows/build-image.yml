name: Build + push image

# Manual by default (cost/quota conscious, same policy as other apps) —
# also fires on push to main when the image-relevant files change.
#
# Auto-triggers disabled 2026-07-26 per Frederico (no automatic GHA runs for now).
# Manual via the Actions tab. Re-enable when ready.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to push alongside :latest and :<sha>"
        type: string
        default: "latest"
  # push:
  #   branches: [main]
  #   paths:
  #     - "Dockerfile"
  #     - "src/**"
  #     - "requirements.txt"

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push multi-arch image
    runs-on: [self-hosted, aw-workspace]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure Podman on macbook-fred runner
        run: |
          PODMAN=/Users/aw/podman-dist/podman/bin/podman
          if [ ! -x "$PODMAN" ]; then
            echo "::error::Podman not found at $PODMAN"
            exit 1
          fi
          "$PODMAN" machine start >/dev/null 2>&1 || true
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/Users/aw/podman-dist/podman/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | "$PODMAN" login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          EXTRA_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER_LC}/aw-workspace"
          MANIFEST="localhost/aw-workspace:${{ github.sha }}"

          "$PODMAN" manifest rm "$MANIFEST" >/dev/null 2>&1 || true
          "$PODMAN" manifest create "$MANIFEST"

          for platform in linux/amd64 linux/arm64; do
            echo "==> Building $platform"
            "$PODMAN" build \
              --pull \
              --platform "$platform" \
              --manifest "$MANIFEST" \
              --build-arg "AW_WORKSPACE_VERSION=${{ github.sha }}" \
              .
          done

          echo "==> Pushing ${IMAGE}:${{ github.sha }}"
          "$PODMAN" manifest push --all "$MANIFEST" "docker://${IMAGE}:${{ github.sha }}"

          echo "==> Pushing ${IMAGE}:${EXTRA_TAG}"
          "$PODMAN" manifest push --all "$MANIFEST" "docker://${IMAGE}:${EXTRA_TAG}"

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-workspace image pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:${{ github.sha }}\` |"
            echo "| **Tag** | \`${{ inputs.tag || 'latest' }}\` |"
            echo "| **Platforms** | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
