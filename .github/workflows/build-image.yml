name: Build + push image

# Manual by default (cost/quota conscious, same policy as other apps) —
# also fires on push to main when the image-relevant files change.
#
# Auto-triggers disabled 2026-07-26 per Frederico (no automatic GHA runs for now).
# Manual via the Actions tab. Re-enable when ready.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to push alongside :latest and :<sha>"
        type: string
        default: "latest"
  # push:
  #   branches: [main]
  #   paths:
  #     - "Dockerfile"
  #     - "src/**"
  #     - "requirements.txt"

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push multi-arch image
    runs-on: [self-hosted, aw-baremetal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:${{ inputs.tag || 'latest' }}
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-workspace image pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:${{ github.sha }}\` |"
            echo "| **Tag** | \`${{ inputs.tag || 'latest' }}\` |"
            echo "| **Platforms** | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
