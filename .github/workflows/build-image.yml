name: Build + push image

# Builds the workspace image on image-relevant pushes and publishes the
# resulting release to aw-backend so aw-console can enable workspace updates.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to push alongside :latest and :<sha>"
        type: string
        default: "latest"
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push multi-arch image
    runs-on: [self-hosted, aw-workspace]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure Podman on macbook-fred runner
        run: |
          PODMAN=/Users/aw/podman-dist/podman/bin/podman
          if [ ! -x "$PODMAN" ]; then
            echo "::error::Podman not found at $PODMAN"
            exit 1
          fi
          "$PODMAN" machine start >/dev/null 2>&1 || true
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/Users/aw/podman-dist/podman/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | "$PODMAN" login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          EXTRA_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER_LC}/aw-workspace"
          MANIFEST="localhost/aw-workspace:${{ github.sha }}"

          "$PODMAN" manifest rm "$MANIFEST" >/dev/null 2>&1 || true
          "$PODMAN" manifest create "$MANIFEST"

          for platform in linux/amd64 linux/arm64; do
            echo "==> Building $platform"
            "$PODMAN" build \
              --pull \
              --platform "$platform" \
              --manifest "$MANIFEST" \
              --build-arg "AW_WORKSPACE_VERSION=${{ github.sha }}" \
              .
          done

          echo "==> Pushing ${IMAGE}:${{ github.sha }}"
          "$PODMAN" manifest push --all "$MANIFEST" "docker://${IMAGE}:${{ github.sha }}"

          echo "==> Pushing ${IMAGE}:${EXTRA_TAG}"
          "$PODMAN" manifest push --all "$MANIFEST" "docker://${IMAGE}:${EXTRA_TAG}"

      - name: Notify aw-backend release registry
        env:
          RELEASE_TOKEN: ${{ secrets.AW_RELEASE_WEBHOOK_TOKEN }}
          OWNER_LC: ${{ steps.owner.outputs.lc }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTRA_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::warning::AW_RELEASE_WEBHOOK_TOKEN is not set; skipping release publish"
            exit 0
          fi

          SHORT_SHA="${SHA::7}"
          python3 - <<'PY' > /tmp/aw-workspace-release.json
          import json
          import os

          owner = os.environ["OWNER_LC"]
          sha = os.environ["SHA"]
          payload = {
              "component": "aw-workspace",
              "version": sha[:7],
              "sha": sha,
              "image": f"ghcr.io/{owner}/aw-workspace",
              "tag": os.environ["EXTRA_TAG"],
              "url": os.environ["RUN_URL"],
              "metadata": {
                  "workflow": "build-image",
                  "run_id": os.environ["RUN_ID"],
              },
          }
          print(json.dumps(payload))
          PY

          curl -fsS -X POST "https://api.aw.tekflox.com/api/releases/publish" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${RELEASE_TOKEN}" \
            --data-binary @/tmp/aw-workspace-release.json

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-workspace image pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-workspace:${{ github.sha }}\` |"
            echo "| **Tag** | \`${{ inputs.tag || 'latest' }}\` |"
            echo "| **Platforms** | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
