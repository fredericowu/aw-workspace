name: Test

on:
  push:
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: [self-hosted, aw-workspace]
    steps:
      - uses: actions/checkout@v4

      # The runner's own system python3 is Xcode's old command-line-tools
      # Python (pip 21.2.4) — too old to resolve some pinned requirements
      # (e.g. fastapi==0.135.2). build-image.yml sidesteps this by building
      # everything inside a container; do the same here instead of trying
      # to get a modern Python installed on the bare host.
      - name: Configure Podman on macbook-fred runner
        run: |
          PODMAN=/Users/aw/podman-dist/podman/bin/podman
          if [ ! -x "$PODMAN" ]; then
            echo "::error::Podman not found at $PODMAN"
            exit 1
          fi
          "$PODMAN" machine start >/dev/null 2>&1 || true
          echo "PODMAN=$PODMAN" >> "$GITHUB_ENV"

      - name: Test suite (in a python:3.12-slim container)
        run: |
          "$PODMAN" run --rm -v "$PWD:/repo:ro" -w /repo python:3.12-slim \
            sh -c "pip install -q -r requirements.txt pytest pytest-asyncio && \
                   python3 -m pytest src/tests \
                     --ignore=src/tests/integration/apps/test_f5_endpoints.py \
                     --ignore=src/tests/integration/apps/test_real_apps.py \
                     -k 'not test_pty_shell_runs_and_echoes' -v"
          # --ignore x2: both load repos/aw-app-git as a real fixture (REPOS =
          # <this repo>/repos/aw-app-git — gitignored runtime state per this
          # repo's own .gitignore, not something CI checks out). Needs an
          # actual clone step to cover; out of scope here.
          # -k (not --deselect: pytest.ini's rootdir is src/tests, so the
          # collected node id here is unit/api/test_terminal_manager.py::...,
          # not src/tests/unit/..., and --deselect silently no-ops on a
          # non-matching id instead of erroring — -k matches by test name
          # regardless of path prefix). test_pty_shell_runs_and_echoes spawns
          # a real PTY shell and asserts on its child processes — reliably
          # fails inside this minimal, nested container (no real
          # terminal/init, restricted process visibility), unrelated to app
          # correctness. Passes fine on a bare host.
