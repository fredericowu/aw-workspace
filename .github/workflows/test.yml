name: Test

on:
  push:
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept container-based (rather than installing Python 3.12 straight on
      # the runner) for consistency with build-image.yml and because it was
      # already working — the ORIGINAL reason (the self-hosted `aw-workspace`
      # runner's own system python3 being Xcode's old command-line-tools
      # Python, pip 21.2.4) no longer applies now that this runs on
      # GitHub-hosted `ubuntu-latest` (2026-09-17), which always has a
      # current Docker Engine. $PODMAN is kept as the variable name below
      # (unchanged, always "docker" now) to minimize the diff against every
      # other step that reads it, rather than renaming it everywhere.
      - name: Select container engine
        run: echo "PODMAN=docker" >> "$GITHUB_ENV"

      # src/tests' own Postgres-gated suites (test_isolation.py, test_db_tables.py,
      # test_workspace_api_key.py, etc. — 10 files) each hardcode
      # 127.0.0.1:5432/postgres for their own `_postgres_reachable()` probe and
      # set AW_WORKSPACE_DB_URL to 127.0.0.1:5432/awserv themselves, so there's
      # no env var to inject for THEM — they just need a real Postgres
      # reachable at that fixed address. That address has to resolve inside the
      # pytest container below, not on the runner host — no published host
      # port either, since this container-join approach predates the move to
      # `ubuntu-latest` (2026-09-17) and a GH Actions `services:` block would
      # be the more idiomatic choice on a GitHub-hosted runner now. Kept as
      # container-join rather than redesigned, since it already works: join
      # the pytest container to the ephemeral Postgres container's OWN network
      # namespace (--network container:<name>) — the exact idiom
      # docker-compose.yml already uses in production (aw-workspace joins
      # aw-sandbox's netns to reach its own Postgres on loopback).
      - name: Start ephemeral Postgres
        id: pg
        run: |
          set -euo pipefail
          NAME="aw-workspace-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          "$PODMAN" run -d --name "$NAME" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=awserv \
            docker.io/library/postgres:16-alpine > /dev/null
          for _ in $(seq 1 40); do
            if "$PODMAN" exec "$NAME" pg_isready -U postgres -d awserv -q; then
              echo "Postgres ready ($NAME)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::throwaway Postgres never became ready"
          "$PODMAN" logs "$NAME"
          exit 1

      # W3 added tests that need a real Redis as well as a real Postgres —
      # the apps:changed fan-out between two worker PROCESSES is not
      # something a single-process test can stand in for, so
      # test_multiworker_app_lifecycle.py skips without one, and a skipped
      # test is how a card's whole VERIFY step quietly stops running.
      # (test_redis_coord.py and test_watchdog_lease_multiworker.py, from W0
      # and W1, were skipping here for the same reason.)
      #
      # Joined to the Postgres container's netns, not its own, for exactly
      # the reason spelled out above it: the suites hardcode loopback
      # addresses, so everything has to share ONE namespace with the pytest
      # container. redis_coord's own default is redis://127.0.0.1:6379/0, so
      # no env var is needed here either.
      - name: Start ephemeral Redis
        id: redis
        run: |
          set -euo pipefail
          NAME="aw-workspace-ci-redis-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          "$PODMAN" run -d --name "$NAME" \
            --network "container:${{ steps.pg.outputs.name }}" \
            docker.io/library/redis:7-alpine > /dev/null
          for _ in $(seq 1 40); do
            if "$PODMAN" exec "$NAME" redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready ($NAME)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::throwaway Redis never became ready"
          "$PODMAN" logs "$NAME"
          exit 1

      - name: Test suite (in a python:3.12-slim container)
        run: |
          "$PODMAN" run --rm --network "container:${{ steps.pg.outputs.name }}" \
            -e AWSERV_DB_URL="postgresql+psycopg://postgres:postgres@127.0.0.1:5432/awserv" \
            -e OTEL_SDK_DISABLED=true \
            -v "$PWD:/repo:ro" -w /repo docker.io/library/python:3.12-slim \
            sh -c "apt-get -qq update && apt-get -qq install -y --no-install-recommends git procps >/dev/null && \
                   git config --global --add safe.directory /repo && \
                   pip install -q -r requirements.txt pytest pytest-asyncio && \
                   python3 -m pytest src/tests \
                     --ignore=src/tests/integration/apps/test_f5_endpoints.py \
                     --ignore=src/tests/integration/apps/test_real_apps.py \
                     -k 'not test_pty_shell_runs_and_echoes' -v"
          # git: python:3.12-slim ships without it, so the four
          # test_contributed_repos.py tests — which init a local origin and
          # clone it, because contributes.repos IS a git feature — died on
          # FileNotFoundError: 'git' and had been red on master. Installing it
          # is the honest fix; skipping when git is absent would have made CI
          # green by dropping the only coverage that feature has.
          # safe.directory: found the hard way switching to ubuntu-latest
          # (2026-09-17) — this container runs as root over `/repo`, which is
          # bind-mounted from the runner's checkout owned by a different UID.
          # Modern git refuses to touch a repo it doesn't own ("detected
          # dubious ownership") unless told otherwise, which made every
          # `git -C ... rev-parse` in-container return "" instead of raising
          # (boot_info.compute_git_head's own degrade-to-empty design turned
          # this into a quiet wrong answer, not a loud one —
          # test_compute_git_head_returns_head_of_this_checkout is what
          # caught it). Never surfaced on the old self-hosted runner because
          # that host's git config was already trusting `/repo` from a prior
          # run, persisted across jobs — the exact kind of masked assumption
          # a fresh, ephemeral runner exposes.
          # No `screen` here any more: W7 replaced the GNU screen relay
          # behind terminal sessions with two Redis Streams per session, so
          # the ephemeral Redis started above stopped being a nicety and
          # became the thing test_w7_terminal_multiworker.py entirely rests
          # on — which is why that file FAILS rather than skips when Redis is
          # unreachable, the same skip-shaped hole the old `screen` install
          # was here to close.
          # procps: python:3.12-slim ships without `ps` either, so
          # test_terminal_manager.py's process-tree tests (_ps_snapshot()
          # shells out to `ps -eo ...`) silently saw an empty process table
          # (broad except Exception: return {}) and failed to find/reap any
          # process. Same shape as the git gap above — an environment-
          # dependency the container image never shipped.
          # --ignore x2: both load repos/aw-app-git as a real fixture (REPOS =
          # <this repo>/repos/aw-app-git — gitignored runtime state per this
          # repo's own .gitignore, not something CI checks out). Needs an
          # actual clone step to cover; out of scope here.
          # -k (not --deselect: pytest.ini's rootdir is src/tests, so the
          # collected node id here is unit/api/test_terminal_manager.py::...,
          # not src/tests/unit/..., and --deselect silently no-ops on a
          # non-matching id instead of erroring — -k matches by test name
          # regardless of path prefix). test_pty_shell_runs_and_echoes spawns
          # a real PTY shell and asserts on its child processes — reliably
          # fails inside this minimal, nested container (no real
          # terminal/init, restricted process visibility), unrelated to app
          # correctness. Passes fine on a bare host.
          # OTEL_SDK_DISABLED: since 65aa118, init_otel() runs unconditionally
          # on every app creation, and ensure_export_state() (called from
          # reconcile_on_boot etc.) has no live AppRuntime in this container
          # to swap in the internal signoz URL, so it falls back to the
          # public tunnel endpoint — which doesn't resolve here. Each span/log
          # batch flush then burned ~10s+ retrying with exponential backoff
          # before giving up, turning a normal-length run into 25+ minutes.
          # This is the OTel SDK's own standard env var (honored directly by
          # TracerProvider/LoggerProvider) — makes both providers no-ops with
          # zero application code changes.

      # Redis first: it lives in the Postgres container's network namespace,
      # so removing Postgres out from under it leaves a container whose netns
      # is gone.
      - name: Stop ephemeral Redis
        if: always()
        run: |
          NAME="${{ steps.redis.outputs.name }}"
          [ -n "$NAME" ] && "$PODMAN" rm -f "$NAME" > /dev/null 2>&1 || true

      - name: Stop ephemeral Postgres
        if: always()
        run: |
          NAME="${{ steps.pg.outputs.name }}"
          [ -n "$NAME" ] && "$PODMAN" rm -f "$NAME" > /dev/null 2>&1 || true
